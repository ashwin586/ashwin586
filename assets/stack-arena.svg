<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0b0f17" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070a0f" stop-opacity="1" />
    </radialGradient>

    <!-- Developer Grid Pattern -->
    <pattern id="devGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <style>
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
        font-size: 13px;
        font-weight: 500;
      }
      
      /* Continuous Moving Streams */
      @keyframes scrollLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-900px); }
      }
      @keyframes scrollRight {
        0% { transform: translateX(-900px); }
        100% { transform: translateX(0px); }
      }

      .stream-left {
        animation: scrollLeft 32s linear infinite;
      }
      .stream-right {
        animation: scrollRight 38s linear infinite;
      }
      .stream-left-slow {
        animation: scrollLeft 42s linear infinite;
      }

      .p-green { fill: #3fb950; font-weight: bold; }
      .p-cyan { fill: #58a6ff; }
      .p-purple { fill: #bc8cff; }
      .p-orange { fill: #f0883e; }
      .p-yellow { fill: #e3b341; }
      .p-dim { fill: #8b949e; }
      .p-dot { fill: #30363d; font-weight: bold; }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="180" rx="14" fill="url(#ambientGlow)" stroke="#30363d" stroke-width="1.5" />
  <rect width="850" height="180" rx="14" fill="url(#devGrid)" />

  <!-- Moving Streams of Famous Commands -->
  <g class="mono-text">
    
    <!-- Row 1: Leftward drift -->
    <g class="stream-left">
      <text x="0" y="48">
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">kubectl</tspan> <tspan class="p-dim">get pods -A -o wide</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-yellow">uvicorn</tspan> <tspan class="p-dim">main:app --reload --port 8000</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">docker</tspan> <tspan class="p-dim">compose up -d --build</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">flutter</tspan> <tspan class="p-dim">run -d chrome</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">python</tspan> <tspan class="p-dim">manage.py migrate --noinput</tspan>
        <!-- Loop duplicate -->
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">kubectl</tspan> <tspan class="p-dim">get pods -A -o wide</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-yellow">uvicorn</tspan> <tspan class="p-dim">main:app --reload --port 8000</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">docker</tspan> <tspan class="p-dim">compose up -d --build</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">flutter</tspan> <tspan class="p-dim">run -d chrome</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">python</tspan> <tspan class="p-dim">manage.py migrate --noinput</tspan>
      </text>
    </g>

    <!-- Row 2: Rightward drift -->
    <g class="stream-right">
      <text x="0" y="98">
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">git</tspan> <tspan class="p-dim">commit -m "feat(core): ship product feature"</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">aws</tspan> <tspan class="p-dim">eks update-kubeconfig --name prod-cluster</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-yellow">npx</tspan> <tspan class="p-dim">next build &amp;&amp; next start</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">psql</tspan> <tspan class="p-dim">-h localhost -U postgres -d core_db</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">dart</tspan> <tspan class="p-dim">compile exe bin/server.dart</tspan>
        <!-- Loop duplicate -->
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">git</tspan> <tspan class="p-dim">commit -m "feat(core): ship product feature"</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">aws</tspan> <tspan class="p-dim">eks update-kubeconfig --name prod-cluster</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-yellow">npx</tspan> <tspan class="p-dim">next build &amp;&amp; next start</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">psql</tspan> <tspan class="p-dim">-h localhost -U postgres -d core_db</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">dart</tspan> <tspan class="p-dim">compile exe bin/server.dart</tspan>
      </text>
    </g>

    <!-- Row 3: Leftward drift -->
    <g class="stream-left-slow">
      <text x="0" y="148">
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">kubectl</tspan> <tspan class="p-dim">apply -f ./deploy/production.yaml</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">npx</tspan> <tspan class="p-dim">react-native run-ios</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">docker</tspan> <tspan class="p-dim">buildx build --platform linux/amd64 -t api:latest .</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">git</tspan> <tspan class="p-dim">push origin main --tags</tspan>
        <!-- Loop duplicate -->
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">kubectl</tspan> <tspan class="p-dim">apply -f ./deploy/production.yaml</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-purple">npx</tspan> <tspan class="p-dim">react-native run-ios</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-orange">docker</tspan> <tspan class="p-dim">buildx build --platform linux/amd64 -t api:latest .</tspan>
        <tspan class="p-dot">   •   </tspan>
        <tspan class="p-green">$</tspan> <tspan class="p-cyan">git</tspan> <tspan class="p-dim">push origin main --tags</tspan>
      </text>
    </g>

  </g>
</svg>
