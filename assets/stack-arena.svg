<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="ambientGlow" cx="50%" cy="20%" r="65%">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#0b0f17" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#070a0f" stop-opacity="1" />
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="devGrid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Badge Shadow -->
    <filter id="badgeGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1f6feb" flood-opacity="0.25" />
    </filter>

    <style>
      .mono-text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      
      /* Moving Commands Stream Animation */
      @keyframes scrollLeft {
        0% { transform: translateX(0px); }
        100% { transform: translateX(-650px); }
      }
      @keyframes scrollRight {
        0% { transform: translateX(-650px); }
        100% { transform: translateX(0px); }
      }

      .stream-left {
        animation: scrollLeft 35s linear infinite;
      }
      .stream-right {
        animation: scrollRight 42s linear infinite;
      }

      /* Floating Badges Keyframes */
      @keyframes floatA {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(12px, -15px) rotate(1.5deg); }
      }
      @keyframes floatB {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(-15px, 12px) rotate(-1.5deg); }
      }
      @keyframes floatC {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(10px, 14px) rotate(1deg); }
      }
      @keyframes floatD {
        0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
        50% { transform: translate(-12px, -12px) rotate(-1deg); }
      }

      .badge-float-1 { animation: floatA 6s ease-in-out infinite; }
      .badge-float-2 { animation: floatB 7s ease-in-out infinite; }
      .badge-float-3 { animation: floatC 8s ease-in-out infinite; }
      .badge-float-4 { animation: floatD 6.5s ease-in-out infinite; }

      .badge {
        transition: transform 0.3s ease;
      }
      .badge:hover {
        filter: drop-shadow(0 0 10px #58a6ff);
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="850" height="340" rx="16" fill="url(#ambientGlow)" stroke="#30363d" stroke-width="1.5" />
  <rect width="850" height="340" rx="16" fill="url(#devGrid)" />

  <!-- Moving Background Commands Streams -->
  <g class="mono-text" font-size="12" fill="#8b949e" opacity="0.22">
    <!-- Stream 1 -->
    <g class="stream-left">
      <text x="0" y="55">$ kubectl get pods -A -o wide   •   $ uvicorn main:app --reload   •   $ docker compose up -d --build   •   $ flutter run -d chrome   •   $ python manage.py migrate   •   $ kubectl get pods -A -o wide   •   $ uvicorn main:app --reload   •   $ docker compose up -d --build   •   $ flutter run -d chrome   •   $ python manage.py migrate</text>
    </g>

    <!-- Stream 2 -->
    <g class="stream-right" fill="#58a6ff">
      <text x="0" y="165">$ git commit -m "feat(api): ship product feature"   •   $ aws eks update-kubeconfig --name prod   •   $ npx next build   •   $ psql -h localhost -U postgres   •   $ dart compile exe server.dart   •   $ git commit -m "feat(api): ship product feature"   •   $ aws eks update-kubeconfig --name prod   •   $ npx next build   •   $ psql -h localhost -U postgres</text>
    </g>

    <!-- Stream 3 -->
    <g class="stream-left" fill="#bc8cff">
      <text x="0" y="275">$ kubectl apply -f ./k8s/deployment.yaml   •   $ npx react-native run-ios   •   $ docker buildx build -t app:latest .   •   $ git push origin main   •   $ curl -X POST https://api.prod/v1   •   $ kubectl apply -f ./k8s/deployment.yaml   •   $ npx react-native run-ios   •   $ docker buildx build -t app:latest .</text>
    </g>
  </g>

  <!-- Floating Interactive Badges Layer -->
  
  <!-- Row 1 Badges -->
  <!-- TypeScript -->
  <g class="badge badge-float-1" transform="translate(45, 75)" filter="url(#badgeGlow)">
    <rect width="130" height="38" rx="19" fill="#161b22" stroke="#388bfd" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#3178c6" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">TS</text>
    <text x="74" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">TypeScript</text>
  </g>

  <!-- Python -->
  <g class="badge badge-float-2" transform="translate(195, 70)" filter="url(#badgeGlow)">
    <rect width="105" height="38" rx="19" fill="#161b22" stroke="#3fb950" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#238636" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">Py</text>
    <text x="62" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Python</text>
  </g>

  <!-- FastAPI -->
  <g class="badge badge-float-3" transform="translate(320, 80)" filter="url(#badgeGlow)">
    <rect width="110" height="38" rx="19" fill="#161b22" stroke="#009688" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#059669" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">⚡</text>
    <text x="66" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">FastAPI</text>
  </g>

  <!-- Next.js -->
  <g class="badge badge-float-4" transform="translate(450, 72)" filter="url(#badgeGlow)">
    <rect width="105" height="38" rx="19" fill="#161b22" stroke="#ffffff" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#000000" stroke="#ffffff" stroke-width="1" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">N</text>
    <text x="64" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Next.js</text>
  </g>

  <!-- React -->
  <g class="badge badge-float-1" transform="translate(575, 78)" filter="url(#badgeGlow)">
    <rect width="95" height="38" rx="19" fill="#161b22" stroke="#61dafb" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#0284c7" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">⚛</text>
    <text x="59" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">React</text>
  </g>

  <!-- Docker -->
  <g class="badge badge-float-3" transform="translate(690, 70)" filter="url(#badgeGlow)">
    <rect width="105" height="38" rx="19" fill="#161b22" stroke="#2496ed" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#0284c7" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">🐳</text>
    <text x="63" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Docker</text>
  </g>

  <!-- Row 2 Badges -->
  <!-- Kubernetes -->
  <g class="badge badge-float-2" transform="translate(60, 145)" filter="url(#badgeGlow)">
    <rect width="135" height="38" rx="19" fill="#161b22" stroke="#326ce5" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#2563eb" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">☸</text>
    <text x="78" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Kubernetes</text>
  </g>

  <!-- Django -->
  <g class="badge badge-float-4" transform="translate(215, 140)" filter="url(#badgeGlow)">
    <rect width="105" height="38" rx="19" fill="#161b22" stroke="#092e20" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#047857" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">dj</text>
    <text x="63" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Django</text>
  </g>

  <!-- Node.js -->
  <g class="badge badge-float-1" transform="translate(340, 150)" filter="url(#badgeGlow)">
    <rect width="110" height="38" rx="19" fill="#161b22" stroke="#339933" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#16a34a" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="9">JS</text>
    <text x="66" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Node.js</text>
  </g>

  <!-- Flutter -->
  <g class="badge badge-float-3" transform="translate(470, 142)" filter="url(#badgeGlow)">
    <rect width="105" height="38" rx="19" fill="#161b22" stroke="#02569b" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#0284c7" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">💙</text>
    <text x="63" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Flutter</text>
  </g>

  <!-- Dart -->
  <g class="badge badge-float-2" transform="translate(595, 148)" filter="url(#badgeGlow)">
    <rect width="90" height="38" rx="19" fill="#161b22" stroke="#0175c2" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#0369a1" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">🎯</text>
    <text x="56" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Dart</text>
  </g>

  <!-- AWS -->
  <g class="badge badge-float-4" transform="translate(705, 142)" filter="url(#badgeGlow)">
    <rect width="90" height="38" rx="19" fill="#161b22" stroke="#ff9900" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#d97706" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">☁</text>
    <text x="56" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">AWS</text>
  </g>

  <!-- Row 3 Badges -->
  <!-- PostgreSQL -->
  <g class="badge badge-float-3" transform="translate(90, 215)" filter="url(#badgeGlow)">
    <rect width="135" height="38" rx="19" fill="#161b22" stroke="#4169e1" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#1d4ed8" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">🐘</text>
    <text x="78" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">PostgreSQL</text>
  </g>

  <!-- React Native -->
  <g class="badge badge-float-1" transform="translate(245, 210)" filter="url(#badgeGlow)">
    <rect width="140" height="38" rx="19" fill="#161b22" stroke="#61dafb" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#0369a1" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">📱</text>
    <text x="81" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">React Native</text>
  </g>

  <!-- Linux -->
  <g class="badge badge-float-4" transform="translate(405, 220)" filter="url(#badgeGlow)">
    <rect width="95" height="38" rx="19" fill="#161b22" stroke="#fcc624" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#ca8a04" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">🐧</text>
    <text x="59" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Linux</text>
  </g>

  <!-- Git -->
  <g class="badge badge-float-2" transform="translate(520, 215)" filter="url(#badgeGlow)">
    <rect width="85" height="38" rx="19" fill="#161b22" stroke="#f05032" stroke-width="1.5" />
    <circle cx="22" cy="19" r="10" fill="#dc2626" />
    <text x="22" y="23" text-anchor="middle" fill="#ffffff" font-family="sans-serif" font-weight="bold" font-size="10">⎇</text>
    <text x="54" y="23" class="mono-text" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Git</text>
  </g>

  <!-- Bottom Interactive Floating Control Pill -->
  <g transform="translate(275, 290)">
    <rect width="300" height="34" rx="17" fill="#0d1117" stroke="#30363d" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#3fb950" />
    <text x="160" y="22" class="mono-text" font-size="11" font-weight="bold" fill="#58a6ff" text-anchor="middle">✨ The Problem Picks the Tool</text>
  </g>
</svg>
